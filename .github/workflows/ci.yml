name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libtool
          echo "/opt/homebrew/opt/libtool/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build library
        run: make all

      - name: Run smoke tests
        run: |
          if [ "$(uname -s)" = "Linux" ]; then
            cd test && LD_LIBRARY_PATH=.. ./testit_libp2p test_public_der_to_private_der test_mbedtls_varint_128_string test_crypto_rsa_private_key_der test_crypto_rsa_signing test_crypto_rsa_public_key_to_peer_id test_crypto_x509_der_to_private2 test_crypto_x509_der_to_private test_crypto_hashing_sha256 test_base58_encode_decode test_base58_size test_base58_max_size test_base58_peer_address test_crypto_encoding_base32_encode
          else
            ./test/testit_libp2p test_public_der_to_private_der test_mbedtls_varint_128_string test_crypto_rsa_private_key_der test_crypto_rsa_signing test_crypto_rsa_public_key_to_peer_id test_crypto_x509_der_to_private2 test_crypto_x509_der_to_private test_crypto_hashing_sha256 test_base58_encode_decode test_base58_size test_base58_max_size test_base58_peer_address test_crypto_encoding_base32_encode
          fi
